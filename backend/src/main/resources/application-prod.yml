# 운영(VM의 Docker Compose)용. 값은 VM의 .env에서 주입한다.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5

logging:
  structured:
    format:
      console: ecs

# 운영에서는 기본값 없이 환경 변수를 받는다. 비어 있으면 기동 시 바인딩에서 실패한다.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  crawler:
    user-agent: "${CRAWLER_USER_AGENT}"

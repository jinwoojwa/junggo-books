version: 2

# 매주 월요일에 생태계별로 minor/patch를 한 PR로 묶는다. major는 개별 PR로 올라온다.
# PR 제목은 Conventional Commits 형식(chore(deps))을 따른다.
updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    labels: ["📦 dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    labels: ["📦 dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    labels: ["📦 dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

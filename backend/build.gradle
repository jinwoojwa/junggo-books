plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.10.4'
}

group = 'com.junggobooks'
version = '0.0.1-SNAPSHOT'
description = '중고책 최저가 비교 서비스 백엔드'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springdocVersion', '3.2.0')
}

dependencies {
	// 웹 · 검증 · 운영
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// 데이터 · 스키마
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'

	// 캐시
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'com.github.ben-manes.caffeine:caffeine'

	// API 문서 (Swagger UI)
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

	// 로컬 개발: bootRun 시 compose.yaml의 PostgreSQL을 자동으로 띄운다
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 포맷: google-java-format AOSP 스타일(들여쓰기 4칸, 100자). 위반은 ./gradlew spotlessApply 로 고친다.
spotless {
	java {
		googleJavaFormat().aosp()
		removeUnusedImports()
		endWithNewline()
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('jar') {
	// bootJar만 만들어 Docker 이미지에서 혼동이 없게 한다
	enabled = false
}

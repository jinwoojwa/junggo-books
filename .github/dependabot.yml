version: 2

# 매주 월요일에 생태계별로 minor/patch를 한 PR로 묶는다. major는 개별 PR로 올라온다.
# PR 제목은 Conventional Commits 형식(chore(deps))을 따른다.
updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    labels: ["📦 dependencies"]
    assignees: ["jinwoojwa"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    labels: ["📦 dependencies"]
    assignees: ["jinwoojwa"]
    commit-message:
      prefix: "chore(deps)"
    # @types/node는 런타임(Node 24, frontend/.nvmrc)에 맞춘다. Node를 올릴 때 함께 올린다.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    labels: ["📦 dependencies"]
    assignees: ["jinwoojwa"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

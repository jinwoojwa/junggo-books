# 로컬 개발용 PostgreSQL.
# ./gradlew bootRun 을 실행하면 spring-boot-docker-compose가 자동으로 띄우고 접속 정보를 연결한다.
# 직접 띄우려면: docker compose up -d
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: junggo_books
      POSTGRES_USER: junggo
      POSTGRES_PASSWORD: junggo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:

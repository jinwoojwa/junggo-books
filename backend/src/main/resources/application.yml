spring:
  application:
    name: junggo-books
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  crawler:
    user-agent: "${CRAWLER_USER_AGENT:junggo-books-crawler (contact: set CRAWLER_USER_AGENT)}"
  alert:
    webhook-url: ${ALERT_WEBHOOK_URL:}
